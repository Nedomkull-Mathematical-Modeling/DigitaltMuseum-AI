[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dimu"
version = "0.2.0"
description = "Transparent Python client and AI-friendly API for DigitaltMuseum"
readme = "README.md"
authors = [{name = "Henrik Blidh", email = "henrik.blidh@nedomkull.com"}]
maintainers = [{name = "Henrik Blidh", email = "henrik.blidh@nedomkull.com"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
docs = [
  "fastapi>=0.115,<1",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocs-static-i18n>=1.3.1,<2",
  "mkdocstrings[python]>=0.29,<1.1",
]
test = [
  "fastapi>=0.115,<1",
]

[project.scripts]
dimu = "dimu:main"

[tool.setuptools]
packages = ["dimu"]
